<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="VASILJEVIĆ — Stolarija &amp; Dizajn enterijera">
  <defs>
    <!-- Background: deep graphite / navy with subtle vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#141b26"/>
      <stop offset="55%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </radialGradient>

    <!-- Champagne-gold stroke for house outline -->
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9DCC6"/>
      <stop offset="45%" stop-color="#CDBA9A"/>
      <stop offset="100%" stop-color="#F4EBDD"/>
    </linearGradient>

    <!-- Wood gradient (warm oak) -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1B082"/>
      <stop offset="45%" stop-color="#B68954"/>
      <stop offset="100%" stop-color="#E0C08E"/>
    </linearGradient>

    <!-- Slight sheen to simulate premium finish -->
    <linearGradient id="woodSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </linearGradient>

    <!-- House outline path (continuous, fluid joins) -->
    <path id="housePath" d="
      M 44 62
      Q 44 52 54 52
      L 102 52
      L 122 38
      L 142 52
      L 190 52
      Q 200 52 200 62
      L 200 122
      Q 200 132 190 132
      L 54 132
      Q 44 132 44 122
      Z" />

    <!-- Blueprint area clip behind V -->
    <clipPath id="bpClip">
      <rect x="68" y="50" width="108" height="86" rx="8"/>
    </clipPath>

    <!-- Panel clips keep grain inside -->
    <clipPath id="leftPanelClip">
      <path d="M 98 56 L 121 56 L 146 136 L 123 136 Z" />
    </clipPath>
    <clipPath id="rightPanelClip">
      <path d="M 132 56 L 155 56 L 132 136 L 109 136 Z" />
    </clipPath>
  </defs>

  <!-- Background (so GitHub preview matches the website look) -->
  <rect x="0" y="0" width="440" height="160" rx="14" fill="url(#bgGrad)"/>

  <!-- ICON (left) -->
  <g>
    <!-- House outline in the BACK (subtle, premium) -->
    <use href="#housePath" fill="none" stroke="url(#goldStroke)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

    <!-- Blueprint grid (behind V) -->
    <g clip-path="url(#bpClip)" opacity="0.32">
      <!-- vertical -->
      <path d="M80 50 V136" stroke="rgba(244,235,221,0.55)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M104 50 V136" stroke="rgba(244,235,221,0.45)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M128 50 V136" stroke="rgba(244,235,221,0.45)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M152 50 V136" stroke="rgba(244,235,221,0.55)" stroke-width="1.8" stroke-linecap="round"/>
      <!-- horizontal -->
      <path d="M68 62 H176" stroke="rgba(244,235,221,0.45)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M68 86 H176" stroke="rgba(244,235,221,0.35)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M68 110 H176" stroke="rgba(244,235,221,0.35)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M68 134 H176" stroke="rgba(244,235,221,0.45)" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Technical plan marks (adds precision cue) -->
    <g opacity="0.55">
      <path d="M64 124 H92" fill="none" stroke="rgba(244,235,221,0.70)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M64 70 V124" fill="none" stroke="rgba(244,235,221,0.70)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M172 76 H198" fill="none" stroke="rgba(244,235,221,0.55)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M172 96 H198" fill="none" stroke="rgba(244,235,221,0.40)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M172 116 H198" fill="none" stroke="rgba(244,235,221,0.30)" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- WOOD V (foreground) -->
    <!-- left leg -->
    <path d="M 98 56 L 121 56 L 146 136 L 123 136 Z"
          fill="url(#woodGrad)"
          stroke="rgba(244,235,221,0.95)"
          stroke-width="2.6"
          stroke-linejoin="round"/>

    <!-- right leg -->
    <path d="M 132 56 L 155 56 L 132 136 L 109 136 Z"
          fill="url(#woodGrad)"
          opacity="0.98"
          stroke="rgba(244,235,221,0.95)"
          stroke-width="2.6"
          stroke-linejoin="round"/>

    <!-- sheen overlay (luxury highlight) -->
    <g opacity="0.22">
      <path d="M 98 56 L 121 56 L 146 136 L 123 136 Z" fill="url(#woodSheen)"/>
      <path d="M 132 56 L 155 56 L 132 136 L 109 136 Z" fill="url(#woodSheen)"/>
    </g>

    <!-- grain lines (very subtle, clipped) -->
    <g stroke="rgba(10,15,24,0.60)" stroke-width="1.8" stroke-linecap="round" opacity="0.18">
      <g clip-path="url(#leftPanelClip)">
        <path d="M92 76 H152"/>
        <path d="M90 96 H154"/>
        <path d="M88 116 H156"/>
      </g>
      <g clip-path="url(#rightPanelClip)">
        <path d="M104 76 H164"/>
        <path d="M102 96 H166"/>
        <path d="M100 116 H168"/>
      </g>
    </g>

    <!-- House outline again in front (very faint) to unify layers -->
    <use href="#housePath" fill="none" stroke="rgba(244,235,221,0.28)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TYPE (right) -->
  <g transform="translate(224,70)">
    <!-- Title: stronger readability via subtle outline against bg -->
    <text x="0" y="0"
          fill="#F4EBDD"
          stroke="rgba(10,15,24,0.75)"
          stroke-width="3"
          paint-order="stroke"
          font-family="Cormorant Garamond, Georgia, serif"
          font-weight="600"
          font-size="34"
          letter-spacing="0.08em">VASILJEVIĆ</text>

    <!-- Divider -->
    <path d="M0 12 H200" stroke="rgba(244,235,221,0.48)" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="0" y="34"
          fill="rgba(244,235,221,0.90)"
          stroke="rgba(10,15,24,0.55)"
          stroke-width="2"
          paint-order="stroke"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-weight="500"
          font-size="13"
          letter-spacing="0.05em">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>

