<svg width="220" height="40" viewBox="0 0 440 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VASILJEVIĆ - Stolarija & Dizajn enterijera">
  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="panelInner" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="oakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A77D"/>
      <stop offset="1" stop-color="#B79267"/>
    </linearGradient>

    <style>
      .stroke{stroke:#0B3D3A;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:miter;fill:none}
      .plan{stroke:#0B3D3A;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:miter;fill:none;opacity:.95}
      .grain{stroke:rgba(0,0,0,.14);stroke-width:2;stroke-linecap:round;fill:none}
      .title{fill:#0B3D3A;font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:700;letter-spacing:.18em}
      .sub{fill:#4C6A67;font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:500;letter-spacing:.06em}
    </style>
  </defs>

  <!-- Ikona -->
  <g transform="translate(16,16)" filter="url(#softShadow)">
    <!-- Kuća / prostor -->
    <path class="stroke" d="M18 48 Q18 40 26 40 L70 40 L104 24 L138 40 L182 40 Q190 40 190 48 L190 120 Q190 128 182 128 L26 128 Q18 128 18 120 Z"/>

    <!-- Plan linije -->
    <path class="plan" d="M58 56 L58 112"/>
    <path class="plan" d="M58 112 L98 112"/>
    <path class="plan" d="M152 112 L124 112"/>

    <!-- Paneli (negativni V) -->
    <g filter="url(#panelInner)">
      <path d="M88 56 L118 56 L136 116 L108 116 Z" fill="url(#oakGrad)"/>
      <path class="grain" d="M92 70 L120 70"/>
      <path class="grain" d="M94 84 L122 84"/>
      <path class="grain" d="M98 98 L126 98"/>
      <path class="grain" d="M102 112 L130 112"/>
    </g>

    <g filter="url(#panelInner)">
      <path d="M122 56 L152 56 L122 116 L98 116 Z" fill="url(#oakGrad)"/>
      <path class="grain" d="M126 70 L150 70"/>
      <path class="grain" d="M124 84 L148 84"/>
      <path class="grain" d="M120 98 L144 98"/>
      <path class="grain" d="M116 112 L140 112"/>
    </g>
  </g>

  <!-- Tipografija -->
  <g transform="translate(220,62)">
    <text class="title" x="0" y="0" font-size="28">VASILJEVIĆ</text>
    <text class="sub" x="0" y="24" font-size="12">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>
