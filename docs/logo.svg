<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="VASILJEVIĆ — Stolarija &amp; Dizajn enterijera">
  <defs>
    <!-- Palette -->
    <!-- graphite #1E1F22 | milk #FAFAF7 | oak #C9A77D | oak2 #B79267 | ink #0D0D0D -->

    <!-- Wood gradient (subtle, premium) -->
    <linearGradient id="oakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A77D"/>
      <stop offset="1" stop-color="#B79267"/>
    </linearGradient>

    <!-- House outline path (reused) -->
    <path id="house" d="M26 70 Q26 58 38 58 L90 58 L116 38 L142 58 L194 58 Q206 58 206 70 L206 130 Q206 142 194 142 L38 142 Q26 142 26 130 Z"/>

    <!-- Clip area for blueprint grid (keeps grid clean inside a box) -->
    <clipPath id="gridClip">
      <rect x="56" y="50" width="120" height="92" rx="6"/>
    </clipPath>

    <!-- Clip panels so grain stays inside -->
    <clipPath id="leftPanelClip">
      <path d="M98 58 L122 58 L148 138 L124 138 Z"/>
    </clipPath>

    <clipPath id="rightPanelClip">
      <path d="M136 58 L160 58 L134 138 L110 138 Z"/>
    </clipPath>
  </defs>

  <!-- Background (makes SVG look correct in GitHub preview too) -->
  <rect x="0" y="0" width="440" height="160" rx="14" fill="#1E1F22"/>

  <!-- ICON: house in background + blueprint grid + wood V -->
  <g>
    <!-- House outline in background (behind everything) -->
    <use href="#house" fill="none" stroke="#FAFAF7" stroke-width="4" stroke-linecap="round" stroke-linejoin="miter" opacity="0.38"/>

    <!-- Blueprint grid behind V (middle-concept vibe) -->
    <g clip-path="url(#gridClip)" opacity="0.42">
      <!-- vertical grid -->
      <path d="M68 50 V142" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M92 50 V142" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M116 50 V142" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M140 50 V142" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M164 50 V142" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <!-- horizontal grid -->
      <path d="M56 62 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 86 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 110 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 134 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- A few architectural plan strokes (clean, minimal) -->
    <g opacity="0.75">
      <path d="M54 128 H88" fill="none" stroke="#FAFAF7" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 74 V128" fill="none" stroke="#FAFAF7" stroke-width="4" stroke-linecap="round"/>
      <path d="M176 78 H206" fill="none" stroke="#FAFAF7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M176 98 H206" fill="none" stroke="#FAFAF7" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Wood V in FOREGROUND (high contrast) -->
    <!-- Left leg (angled panel) -->
    <path d="M98 58 L122 58 L148 138 L124 138 Z" fill="url(#oakGrad)" stroke="#FAFAF7" stroke-width="3" stroke-linejoin="miter"/>

    <!-- Right leg (angled panel) -->
    <path d="M136 58 L160 58 L134 138 L110 138 Z" fill="url(#oakGrad)" opacity="0.95" stroke="#FAFAF7" stroke-width="3" stroke-linejoin="miter"/>

    <!-- Grain (subtle, inside panels only) -->
    <g stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" opacity="0.14">
      <g clip-path="url(#leftPanelClip)">
        <path d="M94 78 H154"/>
        <path d="M92 98 H156"/>
        <path d="M90 118 H158"/>
      </g>
      <g clip-path="url(#rightPanelClip)">
        <path d="M104 78 H170"/>
        <path d="M102 98 H172"/>
        <path d="M100 118 H174"/>
      </g>
    </g>
  </g>

  <!-- TYPE: strong contrast, foreground -->
  <g transform="translate(224,64)">
    <text x="0" y="0"
          fill="#FAFAF7"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-weight="800"
          font-size="30"
          letter-spacing="0.18em">VASILJEVIĆ</text>

    <!-- Divider line (premium, subtle) -->
    <path d="M0 12 H200" stroke="rgba(250,250,247,0.55)" stroke-width="2" stroke-linecap="round"/>

    <text x="0" y="34"
          fill="rgba(250,250,247,0.92)"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-weight="500"
          font-size="13"
          letter-spacing="0.05em">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>
