<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="VASILJEVIĆ — Stolarija &amp; Dizajn enterijera">
  <defs>
    <!-- Palette -->
    <!-- graphite #1E1F22 | milk #FAFAF7 | oak #C9A77D | oak2 #B79267 | ink #0D0D0D -->

    <linearGradient id="oakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A77D"/>
      <stop offset="1" stop-color="#B79267"/>
    </linearGradient>

    <!-- Soft highlight (luxury sheen, subtle) -->
    <linearGradient id="oakSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="0.55" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.10)"/>
    </linearGradient>

    <!-- House outline path (single continuous contour; fluid corners) -->
    <path id="housePath"
          d="M30 72
             Q30 58 44 58
             L92 58
             L116 38
             L140 58
             L188 58
             Q202 58 202 72
             L202 128
             Q202 142 188 142
             L44 142
             Q30 142 30 128
             Z" />

    <!-- Blueprint grid clip (keeps it clean & premium) -->
    <clipPath id="bpClip">
      <rect x="56" y="54" width="120" height="86" rx="8"/>
    </clipPath>

    <!-- Clip wood panels so grain never leaks -->
    <clipPath id="leftPanelClip">
      <path d="M98 58 L122 58 L148 138 L124 138 Z"/>
    </clipPath>
    <clipPath id="rightPanelClip">
      <path d="M136 58 L160 58 L134 138 L110 138 Z"/>
    </clipPath>
  </defs>

  <!-- Background (ensures GitHub preview shows correct contrast) -->
  <rect width="440" height="160" rx="14" fill="#1E1F22"/>

  <!-- ICON BLOCK -->
  <g>
    <!-- House contour in background (fluid, unbroken) -->
    <use href="#housePath" fill="none" stroke="rgba(250,250,247,0.42)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Blueprint grid behind the V -->
    <g clip-path="url(#bpClip)" opacity="0.28">
      <!-- vertical -->
      <path d="M68 54 V140" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M92 54 V140" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M116 54 V140" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M140 54 V140" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M164 54 V140" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <!-- horizontal -->
      <path d="M56 66 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 88 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 110 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 132 H176" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Architectural plan strokes (technical precision cue) -->
    <g opacity="0.62">
      <path d="M54 126 H88" fill="none" stroke="#FAFAF7" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 74 V126" fill="none" stroke="#FAFAF7" stroke-width="4" stroke-linecap="round"/>
      <path d="M176 80 H204" fill="none" stroke="#FAFAF7" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
      <path d="M176 98 H204" fill="none" stroke="#FAFAF7" stroke-width="3.2" stroke-linecap="round" opacity="0.40"/>
      <path d="M176 116 H204" fill="none" stroke="#FAFAF7" stroke-width="3.2" stroke-linecap="round" opacity="0.30"/>
    </g>

    <!-- WOOD V (foreground; crisp; no ugly overlaps) -->
    <!-- Left leg -->
    <path d="M98 58 L122 58 L148 138 L124 138 Z"
          fill="url(#oakGrad)"
          stroke="#FAFAF7"
          stroke-width="3.4"
          stroke-linejoin="round"/>

    <!-- Right leg -->
    <path d="M136 58 L160 58 L134 138 L110 138 Z"
          fill="url(#oakGrad)"
          opacity="0.97"
          stroke="#FAFAF7"
          stroke-width="3.4"
          stroke-linejoin="round"/>

    <!-- Subtle sheen overlay (luxury depth, still flat-ish) -->
    <g opacity="0.22">
      <path d="M98 58 L122 58 L148 138 L124 138 Z" fill="url(#oakSheen)"/>
      <path d="M136 58 L160 58 L134 138 L110 138 Z" fill="url(#oakSheen)"/>
    </g>

    <!-- Grain lines (clipped inside panels; minimal) -->
    <g stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" opacity="0.12">
      <g clip-path="url(#leftPanelClip)">
        <path d="M90 78 H154"/>
        <path d="M88 98 H156"/>
        <path d="M86 118 H158"/>
      </g>
      <g clip-path="url(#rightPanelClip)">
        <path d="M104 78 H172"/>
        <path d="M102 98 H174"/>
        <path d="M100 118 H176"/>
      </g>
    </g>

    <!-- Foreground house contour (very faint, ties layers together; 'fluid' look) -->
    <use href="#housePath" fill="none" stroke="rgba(250,250,247,0.18)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TYPE LOCKUP (foreground; high legibility + luxury) -->
  <g transform="translate(224,64)">
    <!-- Title with outline for readability on any renderer -->
    <text x="0" y="0"
          fill="#FAFAF7"
          stroke="rgba(30,31,34,0.95)"
          stroke-width="3"
          paint-order="stroke"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-weight="800"
          font-size="30"
          letter-spacing="0.18em">VASILJEVIĆ</text>

    <!-- Divider -->
    <path d="M0 12 H200" stroke="rgba(250,250,247,0.58)" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="0" y="34"
          fill="rgba(250,250,247,0.94)"
          stroke="rgba(30,31,34,0.85)"
          stroke-width="2"
          paint-order="stroke"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-weight="500"
          font-size="13"
          letter-spacing="0.05em">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>

