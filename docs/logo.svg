<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VASILJEVIĆ — Stolarija & Dizajn enterijera">
  <defs>
    <!-- Colors -->
    <style>
      :root{
        --graphite:#1E1F22;
        --milk:#FAFAF7;
        --oak:#C9A77D;
        --oak2:#B79267;
        --ink:#0D0D0D;
      }
      .stroke{stroke:var(--milk);stroke-width:4;stroke-linecap:round;stroke-linejoin:miter;}
      .plan{stroke:var(--milk);stroke-width:4;stroke-linecap:round;stroke-linejoin:miter;opacity:.95;}
      .grain{stroke:rgba(0,0,0,.12);stroke-width:2;stroke-linecap:round;}
      .title{fill:var(--milk);font-family:Manrope, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;font-weight:700;letter-spacing:.22em;}
      .sub{fill:rgba(250,250,247,.92);font-family:Manrope, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;font-weight:400;letter-spacing:.06em;}
    </style>

    <!-- Soft shadow under icon -->
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <!-- Very faint inner shadow for wood panels -->
    <filter id="panelInner" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <!-- Subtle wood gradient (still flat-ish, not glossy) -->
    <linearGradient id="oakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--oak)"/>
      <stop offset="1" stop-color="var(--oak2)"/>
    </linearGradient>
  </defs>

  <!-- Transparent background (page controls background) -->
  <!-- ICON -->
  <g transform="translate(120,40)" filter="url(#softShadow)">
    <!-- House/space outline (rounded square + subtle gable) -->
    <!-- 820x820 scaled down into 320x320 area (keep stroke 4) -->
    <path class="stroke" d="
      M 40 120
      Q 40 100 60 100
      L 140 100
      L 200 60
      L 260 100
      L 340 100
      Q 360 100 360 120
      L 360 340
      Q 360 360 340 360
      L 60 360
      Q 40 360 40 340
      Z" />

    <!-- Floor-plan lines: L-walls inset -->
    <!-- Left wall -->
    <path class="plan" d="M 120 140 L 120 320" />
    <!-- Bottom wall with doorway gap (120px wide centered) -->
    <path class="plan" d="M 120 320 L 210 320" />
    <path class="plan" d="M 330 320 L 280 320" />

    <!-- Small plan details (sparse) -->
    <path class="plan" d="M 250 150 L 330 150" opacity=".8"/>
    <path class="plan" d="M 250 220 L 330 220" opacity=".8"/>
    <path class="plan" d="M 250 150 L 250 250" opacity=".55"/>
    <path class="plan" d="M 330 150 L 330 250" opacity=".55"/>

    <!-- WOOD PANELS forming negative-space V -->
    <!-- Left panel -->
    <g filter="url(#panelInner)">
      <path d="M 170 140 L 230 140 L 270 300 L 230 300 Z" fill="url(#oakGrad)"/>
      <!-- Grain lines (horizontal, 18px spacing) -->
      <path class="grain" d="M 176 160 L 232 160"/>
      <path class="grain" d="M 182 178 L 238 178"/>
      <path class="grain" d="M 188 196 L 244 196"/>
      <path class="grain" d="M 194 214 L 250 214"/>
      <path class="grain" d="M 200 232 L 256 232"/>
      <path class="grain" d="M 206 250 L 262 250"/>
      <path class="grain" d="M 212 268 L 268 268"/>
      <path class="grain" d="M 218 286 L 274 286"/>
    </g>

    <!-- Right panel (mirror-ish) -->
    <g filter="url(#panelInner)">
      <path d="M 240 140 L 300 140 L 240 300 L 200 300 Z" fill="url(#oakGrad)"/>
      <path class="grain" d="M 246 160 L 296 160"/>
      <path class="grain" d="M 242 178 L 292 178"/>
      <path class="grain" d="M 238 196 L 288 196"/>
      <path class="grain" d="M 234 214 L 284 214"/>
      <path class="grain" d="M 230 232 L 280 232"/>
      <path class="grain" d="M 226 250 L 276 250"/>
      <path class="grain" d="M 222 268 L 272 268"/>
      <path class="grain" d="M 218 286 L 268 286"/>
    </g>

    <!-- The negative V gap is implied between panels -->
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(520,140)">
    <text class="title" x="0" y="0" font-size="64">VASILJEVIĆ</text>
    <text class="sub" x="0" y="58" font-size="24">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>
