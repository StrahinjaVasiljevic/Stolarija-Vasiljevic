<?xml version="1.0" encoding="UTF-8"?>
<svg width="220" height="40" viewBox="0 0 440 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VASILJEVIĆ — Stolarija & Dizajn enterijera">
  <defs>
    <style>
      :root{
        /* Light theme (site header na beloj pozadini) */
        --fg:#0B3D3A;        /* tamno zelena (brand) za linije i tekst */
        --fg-soft:#4C6A67;   /* mekši akcent za podnaslov */
        --cream:#EDE7DD;     /* krem (koristi se u dark temi) */
        --oak:#C9A77D;       /* drvo gradijent 1 */
        --oak2:#B79267;      /* drvo gradijent 2 */
        --grain:rgba(0,0,0,.12);
      }
      @media (prefers-color-scheme: dark){
        /* Dark theme (karbon crna pozadina) */
        :root{
          --fg:#EDE7DD;      /* krem linije/tekst */
          --fg-soft:#C8C3BB; /* mekši krem za podnaslov */
          --grain:rgba(255,255,255,.14);
        }
      }
      .stroke{stroke:var(--fg);stroke-width:3.8;stroke-linecap:round;stroke-linejoin:miter;}
      .plan{stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:miter;opacity:.95;}
      .grain{stroke:var(--grain);stroke-width:2;stroke-linecap:round}
      .title{fill:var(--fg);font-family:Manrope, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;font-weight:700;letter-spacing:.18em}
      .sub{fill:var(--fg-soft);font-family:Manrope, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;font-weight:500;letter-spacing:.06em}
    </style>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="panelInner" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="oakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--oak)"/>
      <stop offset="1" stop-color="var(--oak2)"/>
    </linearGradient>
  </defs>

  <!-- Ikona (levo) -->
  <g transform="translate(16,8)" filter="url(#softShadow)">
    <!-- Kuća / prostor (kontura) -->
    <path class="stroke" d="
      M 18 48
      Q 18 40 26 40
      L 70 40
      L 104 24
      L 138 40
      L 182 40
      Q 190 40 190 48
      L 190 120
      Q 190 128 182 128
      L 26 128
      Q 18 128 18 120
      Z" />

    <!-- Plan (minimalne linije) -->
    <path class="plan" d="M 58 56 L 58 112" />
    <path class="plan" d="M 58 112 L 98 112" />
    <path class="plan" d="M 152 112 L 124 112" />

    <!-- Drveni paneli koji formiraju negativni V -->
    <!-- Levi panel -->
    <g filter="url(#panelInner)">
      <path d="M 88 56 L 118 56 L 136 116 L 108 116 Z" fill="url(#oakGrad)"/>
      <path class="grain" d="M 92 70 L 120 70"/>
      <path class="grain" d="M 94 84 L 122 84"/>
      <path class="grain" d="M 98 98 L 126 98"/>
      <path class="grain" d="M 102 112 L 130 112"/>
    </g>

    <!-- Desni panel -->
    <g filter="url(#panelInner)">
      <path d="M 122 56 L 152 56 L 122 116 L 98 116 Z" fill="url(#oakGrad)"/>
      <path class="grain" d="M 126 70 L 150 70"/>
      <path class="grain" d="M 124 84 L 148 84"/>
      <path class="grain" d="M 120 98 L 144 98"/>
      <path class="grain" d="M 116 112 L 140 112"/>
    </g>
  </g>

  <!-- Tipografija (desno) -->
  <g transform="translate(220,30)">
    <text class="title" x="0" y="0" font-size="28">VASILJEVIĆ</text>
    <text class="sub" x="0" y="22" font-size="12">Stolarija &amp; Dizajn enterijera</text>
  </g>
</svg>

