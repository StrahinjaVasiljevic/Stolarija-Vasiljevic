<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3D3A">
  <title>Projekti - Stolarija Vasiljević</title>
  <meta name="description" content="Portfolio projekata: kuhinje, plakari, TV komode, zidni paneli, kancelarijski nameštaj i uređenje enterijera. Skica/3D + finalne slike.">

  <link rel="icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = (saved === "dark") || (!saved && prefersDark);
      if (isDark) document.documentElement.classList.add("theme-dark");
    } catch (e) {}
  })();
</script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'brand-dark':'#0B3D3A','brand-beige':'#E9E2D2','brand-light':'#F7F7F5' },
          boxShadow: { card:'0 8px 30px rgba(0,0,0,0.08)' },
          borderRadius: { xl:'16px', '2xl':'24px' },
          fontFamily: { serif:['Cormorant Garamond','serif'], sans:['Inter','ui-sans-serif','system-ui'] }
        }
      }
    };
  </script>

  <style>
    :root{
      --bg:#ffffff; --text:#0b0b0b; --brand:#0B3D3A;
      --card:#ffffff; --border:#f0f0f0; --muted:#6B7280;
      --secondary-bg:#E9E2D2; --text-on-primary:#ffffff;
      --ring:#0B3D3A;

      --toggle-day-bg1:#F7F3EA; --toggle-day-bg2:#E9E2D2; --toggle-day-border:#E4DCCB;
      --toggle-bg1:var(--toggle-day-bg1); --toggle-bg2:var(--toggle-day-bg2); --toggle-border-c:var(--toggle-day-border);
    }
    html.theme-dark{
      --bg:#0D1113; --text:#EDE7DD; --card:#121619; --border:#1E2326;
      --muted:#C8C3BB; --secondary-bg:#2B2F31; --text-on-primary:#EDE7DD;
      --ring:#5FB2AD;

      --toggle-night-bg1:#0F1517; --toggle-night-bg2:#0B3D3A; --toggle-night-border:#1E2A2B;
      --toggle-bg1:var(--toggle-night-bg1); --toggle-bg2:var(--toggle-night-bg2); --toggle-border-c:var(--toggle-night-border);
    }

    body{ background:var(--bg); color:var(--text); }
    .container{max-width:1200px;margin:0 auto;padding:0 16px}
html, body{
  background:var(--bg);
  color:var(--text);
  transition: background-color .25s ease, color .25s ease;
}

a{ color:inherit; }

html.theme-dark .text-gray-700{
  color:#C8C3BB !important;
}

html.theme-dark .text-gray-600{
  color:#B4AEA5 !important;
}

html.theme-dark .text-gray-500{
  color:#9F988E !important;
}

html.theme-dark .bg-white{
  background:var(--card) !important;
}

html.theme-dark .bg-gray-100{
  background:#1A2024 !important;
}

html.theme-dark .border-gray-100,
html.theme-dark .border-gray-200{
  border-color:var(--border) !important;
}

html.theme-dark .hover\:text-brand-dark:hover{
  color:#A6E3DE !important;
}

html.theme-dark .text-brand-dark{
  color:#8FD1CB !important;
}
    
    .site-header{
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    @supports not (background: color-mix(in srgb, white 50%, transparent)){
      .site-header{ background: rgba(255,255,255,0.80); }
      html.theme-dark .site-header{ background: rgba(13,17,19,0.80); }
    }

    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.08)}
    html.theme-dark .card{ box-shadow: 0 16px 40px rgba(0,0,0,0.35); }

    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 20px;font-weight:500;transition:all .2s}
    .btn-primary{background:var(--brand);color:var(--text-on-primary)} .btn-primary:hover{filter:brightness(.95)}
    .btn-secondary{background:var(--secondary-bg);color:#000} .btn-secondary:hover{filter:brightness(.97)}
    html.theme-dark .btn-secondary{color:var(--text)}

    /* Logo */
    .logo { display:inline-flex; align-items:center; justify-content:center; }
    .logo-img { display:block; height:auto; image-rendering:-webkit-optimize-contrast; }
    .logo--header .logo-img { height: 34px; }
    @media (min-width:768px){ .logo--header .logo-img { height: 38px; } }
    @media (min-width:1024px){ .logo--header .logo-img { height: 40px; } }
    .logo-dark { display:none; }
    html.theme-dark .logo-light { display:none; }
    html.theme-dark .logo-dark { display:block; }

    /* Jezik dropdown — kompaktan */
    .dropdown{position:relative}
    #langToggle{ display:flex; align-items:center; gap:6px; padding:6px 10px; min-height:36px; border:1px solid var(--border); border-radius:9999px; background:var(--card); color:var(--text); }
    @media (max-width: 767px){ #langToggle{ min-height:40px; padding:8px 12px; } }
    .flag{ display:inline-block; font-size:16px; line-height:1; }
    .chev{ transition:transform .2s; width:14px; height:14px; }
    .open .chev{ transform:rotate(180deg); }
    .dropdown-menu{ position:absolute; right:0; top:calc(100% + 6px); min-width:160px; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.08); padding:4px; z-index:50 }
    .dropdown-item{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 8px; border-radius:10px; color:var(--text); min-height:34px; }
    .dropdown-item:hover{ background:var(--secondary-bg) }

    /* Theme toggle */
    #themeToggle{
      background: linear-gradient(180deg, var(--toggle-bg1), var(--toggle-bg2));
      border-color: var(--toggle-border-c) !important;
      min-width: 42px; min-height: 42px;
      box-shadow: 0 2px 0 rgba(0,0,0,.04) inset, 0 1px 2px rgba(0,0,0,.08);
      transition: background-color .2s, filter .2s, box-shadow .2s, transform .06s;
    }
    #themeToggle:hover{ filter: brightness(0.98) saturate(1.02); }
    html.theme-dark #themeToggle:hover{ filter: brightness(1.05) saturate(1.02); }

    :where(a, button, input, select, textarea):focus-visible{
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-color: var(--ring);
    }

    /* Modal backdrop */
    .lightbox-backdrop{ background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); }
  </style>

  <!-- Config + main JS -->
  <script src="../assets/config.js"></script>
  <script src="../assets/site.js" defer></script>
</head>

<body class="font-sans" data-page="projects">
  <header class="site-header sticky top-0 z-50">
    <div class="container h-16 flex items-center justify-between">
      <a href="../" class="brand-lockup" aria-label="Početna">
        <span class="logo logo--header">
          <img src="../assets/img/logo-light.svg" alt="Vasiljević" class="logo-img logo-light" decoding="async">
          <img src="../assets/img/logo-dark.svg" alt="Vasiljević" class="logo-img logo-dark" decoding="async">
        </span>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm">
        <a href="../#usluge" class="hover:text-brand-dark" id="navServices">Usluge</a>
        <a href="../#proces" class="hover:text-brand-dark" id="navProcess">Proces</a>
        <a href="./" class="hover:text-brand-dark" id="navProjects">Projekti</a>
        <a href="../#onama" class="hover:text-brand-dark" id="navAbout">O nama</a>
        <a href="../#faq" class="hover:text-brand-dark" id="navFAQ">FAQ</a>
        <a href="../#kontakt" class="hover:text-brand-dark" id="navContact">Kontakt</a>
      </nav>

      <div class="flex items-center gap-2 md:gap-3">
        <!-- Jezik -->
        <div class="dropdown" id="langSelect">
          <button id="langToggle" class="dropdown-btn" aria-haspopup="true" aria-expanded="false" type="button">
            <span class="flag" id="langFlag">🇷🇸</span>
            <span id="langLabel">Jezik: srb</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="langMenu" class="dropdown-menu hidden" role="menu" aria-label="Izaberi jezik">
            <button class="dropdown-item" data-lang="sr" type="button"><span class="flag">🇷🇸</span><span>srb</span></button>
            <button class="dropdown-item" data-lang="en" type="button"><span class="flag">🇬🇧</span><span>eng</span></button>
            <button class="dropdown-item" data-lang="de" type="button"><span class="flag">🇩🇪</span><span>deu</span></button>
            <button class="dropdown-item" data-lang="ru" type="button"><span class="flag">🇷🇺</span><span>rus</span></button>
          </div>
        </div>

        <!-- Tema -->
        <button id="themeToggle" class="p-2 rounded-xl border border-gray-200 hover:bg-gray-100 md:ml-1" aria-label="Promeni temu" type="button">
          <span id="iconLight" class="block" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3 11l9-7 9 7" stroke="#0B3D3A" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M5 10.8V20h14v-9.2" stroke="#0B3D3A" stroke-width="1.5"/>
              <circle cx="18.5" cy="5.5" r="2" fill="#E9E2D2" stroke="#0B3D3A" stroke-width="1"/>
            </svg>
          </span>
          <span id="iconDark" class="hidden" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3 11l9-7 9 7" stroke="#EDE7DD" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M5 10.8V20h14v-9.2" stroke="#EDE7DD" stroke-width="1.5"/>
              <path d="M19 3.5c-1.7.4-3 1.9-3 3.7 0 2.1 1.7 3.8 3.8 3.8 1.7 0 3.2-1.1 3.6-2.8-2.2.3-4.1-1.4-4.4-3.4z" fill="#EDE7DD"/>
            </svg>
          </span>
        </button>

        <a id="headerPhone" href="tel:+381641220429" class="hidden md:inline text-sm font-medium hover:text-brand-dark">+381 64 122 04 29</a>
        <a href="../#kontakt" class="hidden md:inline btn btn-primary text-sm" id="ctaHeader">Pošalji upit</a>
        <a id="headerPhoneMobile" href="tel:+381641220429" class="md:hidden btn btn-primary text-sm">Pozovi</a>
      </div>
    </div>
  </header>

  <main class="py-10">
    <section class="container">
      <div class="flex flex-col gap-2 md:flex-row md:items-end md:justify-between mb-6">
        <div>
          <h1 class="font-serif text-4xl md:text-5xl leading-tight" id="projectsPageTitle">Projekti</h1>
          <p class="text-gray-600 mt-2" id="projectsPageSubtitle">
            Skica/3D + finalne slike. Filtriraj po tipu i lokaciji.
          </p>
        </div>
        <a href="../#kontakt" class="btn btn-primary">Pošalji upit</a>
      </div>

      <!-- site.js renderuje filtere + grid -->
      <div id="projectsPageMount"></div>
    </section>
  </main>

  <!-- Modal / Lightbox + info panel (site.js očekuje ove ID-jeve) -->
  <div id="projectModal" class="hidden fixed inset-0 z-[70] items-center justify-center lightbox-backdrop">
    <div id="projectModalCard" class="w-[94vw] max-w-6xl max-h-[90vh] overflow-hidden rounded-2xl bg-white card border border-gray-200 flex flex-col md:flex-row">
      <!-- Image side -->
      <div class="relative md:w-[62%] bg-gray-100">
        <img id="projectModalImg" src="" alt="" class="w-full h-[52vh] md:h-[90vh] object-contain bg-gray-100">

        <button id="projectPrev" type="button"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 hover:bg-white shadow border border-gray-200 flex items-center justify-center"
                aria-label="Prethodni projekat">‹</button>

        <button id="projectNext" type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 hover:bg-white shadow border border-gray-200 flex items-center justify-center"
                aria-label="Sledeći projekat">›</button>
      </div>

      <!-- Info side -->
      <aside class="md:w-[38%] p-6 overflow-auto">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div id="projectModalMeta" class="text-sm text-gray-500"></div>
            <h2 id="projectModalTitle" class="font-serif text-3xl mt-1"></h2>
          </div>
          <button id="projectClose" type="button"
                  class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center"
                  aria-label="Zatvori">✕</button>
        </div>

        <p id="projectModalDesc" class="text-gray-700 mt-4"></p>

        <div id="projectModalThumbs" class="mt-6 grid grid-cols-3 gap-3"></div>

        <div class="mt-8 flex gap-3 flex-wrap">
          <a href="../#kontakt" class="btn btn-primary">Pošalji upit</a>
          <button id="projectCopyLink" type="button" class="btn btn-secondary">Kopiraj link</button>
        </div>

        <p class="text-xs text-gray-500 mt-4">
          Standard: skica/3D + finalne fotografije nakon montaže.
        </p>
      </aside>
    </div>
  </div>
</body>
</html>
