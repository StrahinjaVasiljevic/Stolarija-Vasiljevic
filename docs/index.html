  <!-- Theme pre-init (sprečava "flash" teme) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = (saved === "dark") || (!saved && prefersDark);
        if (isDark) document.documentElement.classList.add("theme-dark");
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-dark': '#0B3D3A',
            'brand-beige': '#E9E2D2',
            'brand-light': '#F7F7F5'
          },
          boxShadow: { card: '0 8px 30px rgba(0,0,0,0.08)' },
          borderRadius: { xl: '16px', '2xl': '24px' },
          fontFamily: {
            serif: ['Cormorant Garamond', 'serif'],
            sans: ['Inter', 'ui-sans-serif', 'system-ui']
          }
        }
      }
    };
  </script>

  <style>
    :root{
      --bg:#ffffff; --text:#0b0b0b; --cream:#EDE7DD; --brand:#0B3D3A;
      --card:#ffffff; --border:#f0f0f0; --muted:#6B7280;
      --secondary-bg:#E9E2D2; --text-on-primary:#ffffff;
      --surface-1:#ffffff; --surface-2:#FAFAF9; --ring:#0B3D3A;

      --toggle-day-bg1:#F7F3EA; --toggle-day-bg2:#E9E2D2; --toggle-day-border:#E4DCCB;
      --toggle-bg1:var(--toggle-day-bg1); --toggle-bg2:var(--toggle-day-bg2); --toggle-border-c:var(--toggle-day-border);

      --process-wood-light-1:#F2E9DD; --process-wood-light-2:#E6D8C7;
      --process-wood-dark-1:#3A2F28; --process-wood-dark-2:#2C2622;
      --process-text-strong:#0B0B0B; --process-text-muted:#6B7280;
      --process-border:#E6E0D6; --process-connector:#8A8F8C; --process-connector-strong:#0B3D3A;
      --process-shadow:0 6px 24px rgba(0,0,0,.10);
    }
    html.theme-dark{
      --bg:#0D1113; --text:#EDE7DD; --card:#121619; --border:#1E2326;
      --muted:#C8C3BB; --secondary-bg:#2B2F31; --text-on-primary:#EDE7DD;
      --surface-1:#121619; --surface-2:#171C1F; --ring:#5FB2AD;

      --toggle-night-bg1:#0F1517; --toggle-night-bg2:#0B3D3A; --toggle-night-border:#1E2A2B;
      --toggle-bg1:var(--toggle-night-bg1); --toggle-bg2:var(--toggle-night-bg2); --toggle-border-c:var(--toggle-night-border);

      --process-wood-light-1:#1A1E20; --process-wood-light-2:#15191B;
      --process-wood-dark-1:#232828; --process-wood-dark-2:#1B1F21;
      --process-text-strong:#EDE7DD; --process-text-muted:#C8C3BB;
      --process-border:#262C2E; --process-connector:#5E6A69; --process-connector-strong:#5FB2AD;
      --process-shadow:0 12px 32px rgba(0,0,0,.35);
    }

    .container{max-width:1200px;margin:0 auto;padding:0 16px}
    body{background:var(--bg);color:var(--text)}
    a{color:inherit}

    /* Skip link (a11y) */
    .skip-link{
      position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden;
    }
    .skip-link:focus{
      left:16px; top:16px; width:auto; height:auto; padding:10px 12px;
      background:var(--card); border:1px solid var(--border); border-radius:12px; z-index:100;
      outline:2px solid var(--ring); outline-offset:2px;
    }

    .site-header{
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    @supports not (background: color-mix(in srgb, white 50%, transparent)){
      .site-header{ background: rgba(255,255,255,0.80); }
      html.theme-dark .site-header{ background: rgba(13,17,19,0.80); }
    }

    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.08)}
    html.theme-dark .card{ box-shadow: 0 16px 40px rgba(0,0,0,0.35); }
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:12px 20px;font-weight:500;transition:all .2s}
    .btn-primary{background:var(--brand);color:var(--text-on-primary)} .btn-primary:hover{filter:brightness(.95)}
    .btn-secondary{background:var(--secondary-bg);color:#000} .btn-secondary:hover{filter:brightness(.97)}
    html.theme-dark .btn-secondary{color:var(--text)}
    .section{padding:64px 0}.section-title{font-size:32px;margin-bottom:24px}

    html.theme-dark body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
      background:
        radial-gradient(1200px 800px at 20% 0%, rgba(255,255,255,0.02), transparent 60%),
        radial-gradient(1000px 600px at 100% 20%, rgba(255,255,255,0.015), transparent 60%),
        radial-gradient(800px 800px at 50% 100%, rgba(255,255,255,0.02), transparent 60%);
      mix-blend-mode:overlay;
    }
    html.theme-dark .bg-brand-light{background:var(--card)}
    html.theme-dark a:hover{color:#DAD3C7}
    html.theme-dark .text-gray-700{color:var(--text)}
    html.theme-dark .text-gray-600{color:var(--muted)}
    html.theme-dark .bg-white { background: var(--card) !important; }
    html.theme-dark .bg-gray-100, html.theme-dark .bg-gray-200 { background: var(--border) !important; }
    html.theme-dark .border-gray-100, html.theme-dark .border-gray-200 { border-color: var(--border) !important; }
    html.theme-dark .hover\:bg-gray-100:hover { background: var(--secondary-bg) !important; }
    html.theme-dark .text-gray-900, html.theme-dark .text-gray-800, html.theme-dark .text-gray-700 { color: var(--text) !important; }
    html.theme-dark .text-gray-600, html.theme-dark .text-gray-500 { color: var(--muted) !important; }
    html.theme-dark .from-white { --tw-gradient-from: var(--bg) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(0,0,0,0)); }
    html.theme-dark .to-brand-light { --tw-gradient-to: var(--card) !important; }
    html.theme-dark .bg-brand-beige\/30 { background-color: color-mix(in srgb, var(--secondary-bg) 70%, transparent) !important; }

    /* LOGO: tema-aware */
    .logo { display:inline-flex; align-items:center; justify-content:center; }
    .logo-img { display:block; height:auto; image-rendering: -webkit-optimize-contrast; }
    .logo--header .logo-img { height: 32px; }
    @media (min-width:768px){ .logo--header .logo-img { height: 36px; } }
    @media (min-width:1024px){ .logo--header .logo-img { height: 40px; } }
    .logo--contact .logo-img { height: 72px; }
    @media (min-width:768px){ .logo--contact .logo-img { height: 88px; } }
    @media (min-width:1024px){ .logo--contact .logo-img { height: 96px; } }
    .logo-dark { display:none; }
    html.theme-dark .logo-light { display:none; }
    html.theme-dark .logo-dark { display:block; }

    /* Jezik dropdown (kompaktnije, flag i na desktopu) */
    .dropdown{position:relative}
    #langToggle{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px; min-height:38px;
      border:1px solid var(--border); border-radius:9999px;
      background:var(--card); color:var(--text);
      transition: filter .15s ease;
    }
    #langToggle:hover{ filter: brightness(0.98); }
    .flag{ display:inline-flex; align-items:center; justify-content:center; font-size:16px; line-height:1; width:18px; }
    #langLabel{ font-size:12px; color:var(--muted); }
    /* Na telefonu samo zastavica (manje zauzima) */
    @media (max-width: 767px){
      #langLabel{ display:none; }
      #langToggle{ min-height:42px; padding:8px 10px; gap:6px; }
    }
    .chev{ transition:transform .2s; width:14px; height:14px; }
    .open .chev{ transform:rotate(180deg); }
    .dropdown-menu{
      position:absolute; right:0; top:calc(100% + 6px); min-width:160px;
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      box-shadow:0 8px 30px rgba(0,0,0,0.08); padding:4px; z-index:50
    }
    .dropdown-item{
      display:flex; align-items:center; gap:10px; width:100%; text-align:left;
      padding:8px 10px; border-radius:10px; color:var(--text); min-height:36px;
    }
    .dropdown-item:hover{ background:var(--secondary-bg) }

    /* Theme toggle */
    #themeToggle{
      background: linear-gradient(180deg, var(--toggle-bg1), var(--toggle-bg2));
      border-color: var(--toggle-border-c) !important;
      min-width: 42px; min-height: 42px;
      box-shadow: 0 2px 0 rgba(0,0,0,.04) inset, 0 1px 2px rgba(0,0,0,.08);
      transition: background-color .2s, filter .2s, box-shadow .2s, transform .06s;
    }
    #themeToggle:hover{ filter: brightness(0.98) saturate(1.02); }
    html.theme-dark #themeToggle:hover{ filter: brightness(1.05) saturate(1.02); }
    #themeToggle:active{ transform: translateY(0.5px); }
    #themeToggle svg{ display:block; }

    :where(input, select, textarea){
      background: var(--card); color: var(--text); border-color: var(--border);
    }
    :where(input, select, textarea)::placeholder{ color: var(--muted); opacity: 1; }
    :where(a, button, input, select, textarea, [role="button"], .dropdown-btn, .process-card):focus-visible{
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-color: var(--ring);
    }

    /* ==== PROCES FLOW ==== */
    .process-flow .process-row{ display:grid; align-items:start; grid-auto-rows:1fr; gap:14px; margin-bottom:28px; }
    .process-flow .process-row--top{ grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; }
    .process-flow .process-row--bottom{ grid-template-columns: 1fr auto 1fr auto 1fr; }
    @media (max-width: 1023px){
      .process-flow .process-row--top, .process-flow .process-row--bottom{ grid-template-columns: 1fr; gap:12px; }
      .process-flow .process-connector{ display:none; }
      .process-flow .process-turn{ display:none; }
    }
    .process-flow .process-item{ min-width:0; }
    .process-flow .process-card{
      width:100%; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
      border:1px solid var(--process-border); border-radius:16px; padding:16px 16px 14px;
      box-shadow:var(--process-shadow); text-align:left; color:var(--process-text-strong);
      background:
        linear-gradient(180deg, var(--process-wood-light-1), var(--process-wood-light-2)),
        repeating-linear-gradient(25deg, rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px, rgba(0,0,0,0.02) 1px, rgba(0,0,0,0.02) 4px),
        radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,0.25), transparent 60%);
      transition: transform .12s ease, filter .15s ease;
    }
    .process-flow .process-card:hover{ filter:saturate(1.03) brightness(1.01); }
    .process-flow .process-card:active{ transform: translateY(0.5px); }
    .process-flow .process-chip{
      display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:28px; padding:0 8px;
      border:1px solid var(--process-border); border-radius:8px;
      font: 600 13px/1.1 ui-monospace, Menlo, Consolas, monospace;
      color: var(--process-connector-strong); background: rgba(255,255,255,0.35);
    }
    html.theme-dark .process-flow .process-chip{ background: rgba(255,255,255,0.06); }
    .process-flow .process-title{ font-weight:600; font-size:16px; }
    .process-flow .process-sub{ font-size:13px; color:var(--process-text-muted); }
    .process-flow .process-panel{ overflow:hidden; max-height:0; opacity:0; transform: translateY(-4px);
      transition: max-height 220ms ease, opacity 200ms ease, transform 200ms ease; }
    .process-flow .process-panel.open{ opacity:1; transform: translateY(0); }
    .process-flow .process-panel-inner{
      margin-top:10px; border:1px solid var(--process-border); border-radius:14px; padding:14px; color:var(--process-text-strong);
      background:
        linear-gradient(180deg, var(--process-wood-dark-1), var(--process-wood-dark-2)),
        repeating-linear-gradient(20deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, rgba(0,0,0,0.04) 1px, rgba(0,0,0,0.04) 5px),
        radial-gradient(120% 60% at 70% 0%, rgba(255,255,255,0.06), transparent 60%);
    }
    .process-flow .process-connector{ display:flex; align-items:center; justify-content:center; color: var(--process-connector); }
    .process-flow .process-turn{ display:flex; align-items:center; justify-content:flex-end; margin: -6px 0 10px; color: var(--process-connector); }
    .process-flow .process-connector svg, .process-flow .process-turn svg{ display:block; }

    /* Lightbox overlay (da uvek radi + dark kontrast za close) */
    .lightbox-backdrop{
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
    }
    html.theme-dark #lightboxClose{
      background: var(--card) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
  </style>

  <!-- Config + main script (učitava se samo jednom) -->
  <script src="./assets/config.js"></script>
  <script src="./assets/site.js" defer></script>
</head>
